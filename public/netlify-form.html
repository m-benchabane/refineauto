<!doctype html>
<html lang="fr">
  <head><meta charset="utf-8"><title>RefineAuto</title></head>
  <body>
    <!--
      Netlify scans this static file during deployment. The Next.js form submits
      to this exact static path so the submission is handled by Netlify Forms.
      Keep every field name in sync with components/booking-form.tsx.
    -->
    <form name="refineauto-booking" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="refineauto-booking">
      <p style="position:absolute;overflow:hidden;clip:rect(0 0 0 0);height:1px;width:1px;margin:-1px;padding:0;border:0">
        <label>Ne pas remplir ce champ <input name="bot-field"></label>
      </p>
      <input name="formule"><input name="type-vehicule"><input name="etat-vehicule">
      <input name="nom"><input name="telephone"><input name="email"><input name="ville">
      <input name="code-postal"><input name="disponibilite"><textarea name="message"></textarea>
    </form>
  </body>
</html>
